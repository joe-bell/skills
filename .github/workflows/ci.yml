name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # `npx` installs each tool's dependencies fresh, without a lockfile.
      # Skip any release younger than seven days (npm 11.10 or later, which
      # Node 24 bundles), a buffer against compromised or quickly yanked
      # releases. A pinned tool version younger than that fails the step.
      NPM_CONFIG_MIN_RELEASE_AGE: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npx --yes prettier@3.9.9 --check .
      - run: npx --yes skill-check@1.2.0 check ./skills --no-security-scan --strict
      - run: node --test tests/apple-web-app-snippets.test.mjs
